name: Build Forge 1.20.1

on:
  push:
    branches: ['1.20.1']
  pull_request:
    branches: ['1.20.1']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch verified development dependencies
        shell: pwsh
        run: ./scripts/fetch-dependencies.ps1

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: powahcoe-1.20.1
          path: build/libs/*.jar
